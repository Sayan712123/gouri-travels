<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="page.tripsTitle">All Trips — Gouri Travels</title>
  <meta name="description" content="All Gouri Travels trip packages — see price, date and seats, then book online." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand" href="index.html"><span class="brand__mark">GT</span><span data-brand>Gouri Travels</span></a>
      <nav class="nav" data-nav>
        <a href="index.html" data-i18n="nav.home">Home</a>
        <a href="trips.html" data-i18n="nav.trips">All Trips</a>
        <a href="contact.html" data-i18n="nav.contact">Contact</a>
        <a href="admin/index.html" data-i18n="nav.admin">Admin</a>
      </nav>
      <div class="header-actions">
        <button class="lang-switch" data-lang-toggle type="button" aria-label="Switch language">
          <span data-lang-opt="en">EN</span><span data-lang-opt="bn">বাং</span>
        </button>
        <a class="btn btn--sm" href="contact.html" data-i18n="nav.custom">Custom Trip</a>
        <button class="nav-toggle" data-nav-toggle aria-label="Menu">☰</button>
      </div>
    </div>
  </header>

  <section class="page-head">
    <div class="wrap">
      <div class="breadcrumb"><a href="index.html" data-i18n="nav.home">Home</a> / <span data-i18n="nav.trips">All Trips</span></div>
      <h1 data-i18n="trips.title">Our trip packages</h1>
      <p data-i18n="trips.sub">Every package includes stay, transport and a local guide.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="filters" id="filters">
        <button class="chip is-active" data-filter="all" data-i18n="trips.all">All</button>
        <button class="chip" data-filter="short" data-i18n="trips.short">1–3 days</button>
        <button class="chip" data-filter="mid" data-i18n="trips.mid">4–5 days</button>
        <button class="chip" data-filter="long" data-i18n="trips.long">6+ days</button>
        <button class="chip" data-filter="budget" data-i18n="trips.budget">Under ₹10,000</button>
      </div>
      <div class="trip-grid" id="trip-grid"></div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-bottom" style="border:0;padding:0">
        <span>© <span data-year></span> <span data-brand>Gouri Travels</span>. <span data-i18n="foot.rights">All rights reserved.</span></span>
        <span><a data-phone href="#" style="display:inline">—</a></span>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/site.js"></script>
  <script>
    (async function () {
      const grid = document.getElementById("trip-grid");
      const params = new URLSearchParams(location.search);
      const q = (params.get("q") || "").toLowerCase();
      const month = params.get("month") || "";
      let all = [];
      let active = "all";

      function duration(t) {
        const d = GT.daysOf(t);
        if (d.length) return d.length;
        const m = /(\d+)\s*(?:days|din|দিন)/i.exec(GT.parseDetails(t.details).ov || "");
        return m ? Number(m[1]) : 1;
      }

      function render() {
        let list = all.slice();
        if (q) {
          list = list.filter(function (t) {
            return (String(t.title || "") + " " + String(t.to_place || "") + " " + String(t.from_place || "") + " " + String(GT.parseDetails(t.details).ov || "")).toLowerCase().indexOf(q) !== -1;
          });
        }
        if (month) list = list.filter(function (t) { return String(t.trip_date || "").startsWith(month); });
        if (active === "short") list = list.filter(function (t) { return duration(t) <= 3; });
        if (active === "mid") list = list.filter(function (t) { const d = duration(t); return d >= 4 && d <= 5; });
        if (active === "long") list = list.filter(function (t) { return duration(t) >= 6; });
        if (active === "budget") list = list.filter(function (t) { return Number(t.price) < 10000; });

        grid.innerHTML = list.length
          ? list.map(GT.tripCard).join("")
          : '<div class="empty-state" style="grid-column:1/-1"><strong>' + GT.t("trips.none") + "</strong>" + GT.t("trips.noneSub") + "</div>";
      }

      grid.innerHTML = GT.skeletonCards(6);
      try {
        all = await GT.fetchTrips();
        render();
      } catch (err) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><strong>' + GT.t("trips.fail") + "</strong>" + GT.escapeHtml(err.message) + "</div>";
      }
      GT.applyBrand();

      document.addEventListener("gt:langchange", render);

      document.getElementById("filters").addEventListener("click", function (e) {
        const btn = e.target.closest("[data-filter]");
        if (!btn) return;
        document.querySelectorAll(".chip").forEach(function (c) { c.classList.remove("is-active"); });
        btn.classList.add("is-active");
        active = btn.dataset.filter;
        render();
      });
    })();
  </script>
</body>
</html>
