<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="page.adminTitle">Admin Login — Gouri Travels</title>
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <span class="mark">GT</span>
        <span>Gouri Travels</span>
      </div>

      <div class="login-lang">
        <button class="lang-switch" data-lang-toggle type="button" aria-label="Switch language">
          <span data-lang-opt="en">EN</span><span data-lang-opt="bn">বাং</span>
        </button>
      </div>

      <h1 data-i18n="adm.login">Admin login</h1>
      <p class="sub" data-i18n="adm.loginSub">Sign in to manage bookings and trips.</p>

      <div id="login-alert"></div>

      <button class="btn btn--block btn--google" id="google-btn" type="button">
        <span data-i18n="adm.google">Sign in with Google</span>
      </button>

      <div class="or-sep"><span data-i18n="adm.or">or</span></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email" data-i18n="adm.email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="admin@example.com" />
        </div>
        <div class="field">
          <label for="password" data-i18n="adm.password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button class="btn btn--block" type="submit" id="login-btn" data-i18n="adm.signIn">Login</button>
      </form>

      <p style="margin:20px 0 0;font-size:.82rem;color:#7b8a84;text-align:center">
        <a href="../index.html" style="color:#0f6b52;font-weight:600" data-i18n="adm.back">← Back to the public site</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
