<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="page.adminTitle">Admin Login — Gouri Travels</title>
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png" />
  <link rel="shortcut icon" href="../assets/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#0a090b" />
  <link rel="stylesheet" href="css/admin.css" />
  <script src="../js/theme.js"></script>
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <img class="brand__logo--on-light" src="../assets/logo-full-light.png" alt="Gouri Travels" width="160" height="40" />
        <img class="brand__logo--on-dark" src="../assets/logo-full-dark.png" alt="Gouri Travels" width="160" height="40" />
      </div>

      <div class="login-lang">
        <button class="theme-switch" data-theme-toggle type="button" aria-label="Toggle theme" aria-pressed="true">
          <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"/></svg>
        </button>
        <button class="lang-switch" data-lang-toggle type="button" aria-label="Switch language">
          <span data-lang-opt="en">EN</span><span data-lang-opt="bn">বাং</span>
        </button>
      </div>

      <h1 data-i18n="adm.login">Admin login</h1>
      <p class="sub" data-i18n="adm.loginSub">Sign in to manage bookings and trips.</p>

      <div id="login-alert"></div>

      <button class="btn btn--block btn--google" id="google-btn" type="button">
        <span data-i18n="adm.google">Sign in with Google</span>
      </button>

      <div class="or-sep"><span data-i18n="adm.or">or</span></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email" data-i18n="adm.email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="admin@example.com" />
        </div>
        <div class="field">
          <label for="password" data-i18n="adm.password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button class="btn btn--block" type="submit" id="login-btn" data-i18n="adm.signIn">Login</button>
      </form>

      <p style="margin:20px 0 0;font-size:.82rem;color:#7b8a84;text-align:center">
        <a href="../index.html" style="color:#0f6b52;font-weight:600" data-i18n="adm.back">← Back to the public site</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
